name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          command -v ffmpeg || brew install ffmpeg
          ffmpeg -version
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find scripts assets/vendor/video-publisher/scripts -name '*.mjs')
      - name: Run tests and verify upstream snapshot
        run: node --test tests/*.test.mjs assets/vendor/video-publisher/scripts/tests/*.test.mjs assets/vendor/video-publisher/scripts/v2/tests/*.test.mjs
